<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Lunch</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      background-color: #ffffff;
      color: #1c1c1e;
      min-height: 100vh;
    }

    /* Main Content */
    .content {
      padding: 28px 20px 40px 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    .page-title {
      font-size: 34px;
      font-weight: 700;
      color: #1c1c1e;
      margin-bottom: 6px;
    }

    .page-subtitle {
      font-size: 19px;
      color: #8e8e93;
      margin-bottom: 24px;
    }

    /* Day Selector */
    .day-selector {
      background-color: #ffffff;
      border: 1px solid #e5e5ea;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 24px;
    }

    .day-label {
      font-size: 17px;
      font-weight: 600;
      color: #1c1c1e;
      margin-bottom: 10px;
    }

    .select-wrapper {
      position: relative;
    }

    .day-select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      background-color: #ffffff;
      border: 1px solid #d1d1d6;
      border-radius: 10px;
      padding: 12px 40px 12px 14px;
      font-size: 17px;
      color: #1c1c1e;
      font-weight: 500;
      cursor: pointer;
      outline: none;
    }

    .day-select:focus {
      border-color: #007aff;
    }

    .select-arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #8e8e93;
    }

    .select-arrow svg {
      width: 18px;
      height: 18px;
    }

    /* Meals Header */
    .meals-header {
      font-size: 22px;
      font-weight: 600;
      color: #8e8e93;
      margin-bottom: 16px;
    }

    /* Meal Card */
    .meal-card {
      background-color: #ffffff;
      border: 1px solid #e5e5ea;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 14px;
    }

    .meal-name {
      font-size: 26px;
      font-weight: 700;
      color: #1c1c1e;
      margin-bottom: 8px;
    }

    .meal-desc {
      font-size: 17px;
      color: #636366;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .meal-footer {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .meal-price {
      font-size: 24px;
      font-weight: 700;
      color: #1c1c1e;
    }

    .diet-tag {
      font-size: 14px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid;
      white-space: nowrap;
    }

    .diet-tag.vegetarian {
      color: #2d6a4f;
      background-color: #f0fdf4;
      border-color: #95d5b2;
    }

    .diet-tag.meat {
      color: #636366;
      background-color: #f2f2f7;
      border-color: #d1d1d6;
    }

    /* Footer Note */
    .footer-note {
      margin-top: 36px;
      font-size: 15px;
      color: #8e8e93;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <!-- Main Content -->
  <div class="content">
    <h1 class="page-title">Campus Lunch</h1>
    <p class="page-subtitle" id="daySubtitle">Monday's meals</p>

    <!-- Day Selector -->
    <div class="day-selector">
      <div class="day-label">Day</div>
      <div class="select-wrapper">
        <select class="day-select" id="daySelect">
          <option value="monday">Monday</option>
          <option value="tuesday">Tuesday</option>
          <option value="wednesday">Wednesday</option>
          <option value="thursday">Thursday</option>
          <option value="friday">Friday</option>
        </select>
        <div class="select-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>
    </div>

    <!-- Meals Header -->
    <div class="meals-header" id="mealsHeader">3 meals</div>

    <!-- Meal Cards Container -->
    <div id="mealList"></div>

    <!-- Footer Note -->
    <p class="footer-note">Classroom sample data. Not a real cafeteria menu.</p>
  </div>

  <script>
    const menuData = {
      monday: [
        { name: "Bibimbap", desc: "Rice, vegetables, and gochujang.", price: "₩6,500", diet: "vegetarian", dietLabel: "Vegetarian" },
        { name: "Chicken rice", desc: "Grilled chicken with steamed rice.", price: "₩7,000", diet: "meat", dietLabel: "Contains meat or fish" },
        { name: "Tofu bowl", desc: "Tofu, greens, and sesame dressing.", price: "₩6,000", diet: "vegetarian", dietLabel: "Vegetarian" }
      ],
      tuesday: [
        { name: "Kimchi stew", desc: "Spicy kimchi soup with pork and tofu.", price: "₩7,500", diet: "meat", dietLabel: "Contains meat or fish" },
        { name: "Vegetable noodles", desc: "Handmade noodles with seasonal vegetables.", price: "₩5,800", diet: "vegetarian", dietLabel: "Vegetarian" },
        { name: "Fish curry", desc: "Creamy curry with white fish and rice.", price: "₩8,200", diet: "meat", dietLabel: "Contains meat or fish" }
      ],
      wednesday: [
        { name: "Kimbap", desc: "Seaweed rice rolls with vegetables and egg.", price: "₩5,500", diet: "vegetarian", dietLabel: "Vegetarian" },
        { name: "Bulgogi bowl", desc: "Marinated beef with steamed rice.", price: "₩8,500", diet: "meat", dietLabel: "Contains meat or fish" }
      ],
      thursday: [
        { name: "Jjajangmyeon", desc: "Black bean noodles with diced pork.", price: "₩6,800", diet: "meat", dietLabel: "Contains meat or fish" },
        { name: "Temple food plate", desc: "Traditional monk-style vegetable feast.", price: "₩7,000", diet: "vegetarian", dietLabel: "Vegetarian" },
        { name: "Shrimp fried rice", desc: "Wok-fried rice with shrimp and veggies.", price: "₩7,800", diet: "meat", dietLabel: "Contains meat or fish" },
        { name: "Mushroom porridge", desc: "Warm rice porridge with wild mushrooms.", price: "₩5,200", diet: "vegetarian", dietLabel: "Vegetarian" }
      ],
      friday: [
        { name: "Fried chicken set", desc: "Crispy fried chicken with fries and drink.", price: "₩9,500", diet: "meat", dietLabel: "Contains meat or fish" },
        { name: "Veggie wrap", desc: "Fresh vegetables wrapped in flatbread.", price: "₩5,000", diet: "vegetarian", dietLabel: "Vegetarian" }
      ]
    };

    const dayNames = {
      monday: "Monday", tuesday: "Tuesday", wednesday: "Wednesday",
      thursday: "Thursday", friday: "Friday"
    };

    function renderMeals(day) {
      const meals = menuData[day] || [];
      const listEl = document.getElementById("mealList");
      const headerEl = document.getElementById("mealsHeader");
      const subtitleEl = document.getElementById("daySubtitle");

      listEl.innerHTML = "";
      headerEl.textContent = `${meals.length} meal${meals.length === 1 ? "" : "s"}`;
      subtitleEl.textContent = `${dayNames[day]}'s meals`;

      meals.forEach((meal) => {
        const card = document.createElement("div");
        card.className = "meal-card";
        card.innerHTML = `
          <div class="meal-name">${meal.name}</div>
          <div class="meal-desc">${meal.desc}</div>
          <div class="meal-footer">
            <div class="meal-price">${meal.price}</div>
            <span class="diet-tag ${meal.diet}">${meal.dietLabel}</span>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    document.getElementById("daySelect").addEventListener("change", (e) => {
      renderMeals(e.target.value);
    });

    renderMeals("monday");
  </script>
</body>
</html>
