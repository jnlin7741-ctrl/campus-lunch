<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Lunch</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      background-color: #f2f2f7;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 0;
    }

    .phone-frame {
      width: 100%;
      max-width: 420px;
      background-color: #ffffff;
      min-height: 100vh;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
    }

    /* Top Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px 6px 24px;
      font-size: 16px;
      font-weight: 600;
      color: #000;
    }

    .status-right {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .signal-icon, .wifi-icon {
      width: 18px;
      height: 12px;
      background: #000;
      clip-path: polygon(0% 100%, 25% 70%, 50% 45%, 75% 20%, 100% 0%, 100% 100%);
    }

    .battery {
      width: 24px;
      height: 12px;
      border: 1.5px solid #000;
      border-radius: 3px;
      position: relative;
      padding: 1.5px;
    }
    .battery::after {
      content: "";
      position: absolute;
      right: -3px;
      top: 3px;
      width: 2px;
      height: 6px;
      background: #000;
      border-radius: 0 1px 1px 0;
    }
    .battery-level {
      width: 80%;
      height: 100%;
      background: #000;
      border-radius: 1px;
    }

    /* Navigation Bar */
    .nav-bar {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid #e5e5ea;
    }

    .back-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
      stroke: #007aff;
    }

    .nav-title {
      flex: 1;
      font-size: 20px;
      font-weight: 600;
      color: #1c1c1e;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 8px;
    }

    .info-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .info-btn svg {
      width: 22px;
      height: 22px;
      stroke: #007aff;
    }

    /* Main Content */
    .content {
      padding: 28px 20px 40px 20px;
    }

    .page-title {
      font-size: 34px;
      font-weight: 700;
      color: #1c1c1e;
      margin-bottom: 6px;
    }

    .page-subtitle {
      font-size: 19px;
      color: #8e8e93;
      margin-bottom: 24px;
    }

    /* Day Selector */
    .day-selector {
      background-color: #ffffff;
      border: 1px solid #e5e5ea;
      border-radius: 14px;
      padding: 18px 18px 18px 18px;
      margin-bottom: 24px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .day-label {
      font-size: 17px;
      font-weight: 600;
      color: #1c1c1e;
      margin-bottom: 10px;
    }

    .select-wrapper {
      position: relative;
    }

    .day-select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      background-color: #ffffff;
      border: 1px solid #d1d1d6;
      border-radius: 10px;
      padding: 12px 40px 12px 14px;
      font-size: 17px;
      color: #1c1c1e;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    .day-select:focus {
      border-color: #007aff;
    }

    .select-arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #8e8e93;
    }

    .select-arrow svg {
      width: 18px;
      height: 18px;
    }

    /* Meals Header */
    .meals-header {
      font-size: 22px;
      font-weight: 600;
      color: #8e8e93;
      margin-bottom: 16px;
    }

    /* Meal Card */
    .meal-card {
      background-color: #ffffff;
      border: 1px solid #e5e5ea;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .meal-name {
      font-size: 26px;
      font-weight: 700;
      color: #1c1c1e;
      margin-bottom: 8px;
    }

    .meal-desc {
      font-size: 17px;
      color: #636366;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .meal-footer {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .meal-price {
      font-size: 24px;
      font-weight: 700;
      color: #1c1c1e;
    }

    .diet-tag {
      font-size: 14px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid;
      white-space: nowrap;
    }

    .diet-tag.vegetarian {
      color: #2d6a4f;
      background-color: #f0fdf4;
      border-color: #95d5b2;
    }

    .diet-tag.meat {
      color: #636366;
      background-color: #f2f2f7;
      border-color: #d1d1d6;
    }

    /* Footer Note */
    .footer-note {
      margin-top: 36px;
      font-size: 15px;
      color: #8e8e93;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <!-- Status Bar -->
    <div class="status-bar">
      <span>16:45</span>
      <div class="status-right">
        <div class="signal-icon"></div>
        <div class="wifi-icon" style="clip-path: polygon(20% 60%, 50% 20%, 80% 60%, 65% 50%, 50% 65%, 35% 50%); height:14px;"></div>
        <div class="battery"><div class="battery-level"></div></div>
      </div>
    </div>

    <!-- Navigation Bar -->
    <div class="nav-bar">
      <div class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </div>
      <div class="nav-title">Assignment-01-first-we...</div>
      <div class="info-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
      </div>
    </div>

    <!-- Main Content -->
    <div class="content">
      <h1 class="page-title">Campus Lunch</h1>
      <p class="page-subtitle" id="daySubtitle">Monday's meals</p>

      <!-- Day Selector -->
      <div class="day-selector">
        <div class="day-label">Day</div>
        <div class="select-wrapper">
          <select class="day-select" id="daySelect">
            <option value="monday">Monday</option>
            <option value="tuesday">Tuesday</option>
            <option value="wednesday">Wednesday</option>
            <option value="thursday">Thursday</option>
            <option value="friday">Friday</option>
          </select>
          <div class="select-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
      </div>

      <!-- Meals Header -->
      <div class="meals-header" id="mealsHeader">3 meals</div>

      <!-- Meal Cards Container -->
      <div id="mealList"></div>

      <!-- Footer Note -->
      <p class="footer-note">Classroom sample data. Not a real cafeteria menu.</p>
    </div>
  </div>

  <script>
    // Menu data for each day
    const menuData = {
      monday: [
        {
          name: "Bibimbap",
          desc: "Rice, vegetables, and gochujang.",
          price: "₩6,500",
          diet: "vegetarian",
          dietLabel: "Vegetarian"
        },
        {
          name: "Chicken rice",
          desc: "Grilled chicken with steamed rice.",
          price: "₩7,000",
          diet: "meat",
          dietLabel: "Contains meat or fish"
        },
        {
          name: "Tofu bowl",
          desc: "Tofu, greens, and sesame dressing.",
          price: "₩6,000",
          diet: "vegetarian",
          dietLabel: "Vegetarian"
        }
      ],
      tuesday: [
        {
          name: "Kimchi stew",
          desc: "Spicy kimchi soup with pork and tofu.",
          price: "₩7,500",
          diet: "meat",
          dietLabel: "Contains meat or fish"
        },
        {
          name: "Vegetable noodles",
          desc: "Handmade noodles with seasonal vegetables.",
          price: "₩5,800",
          diet: "vegetarian",
          dietLabel: "Vegetarian"
        },
        {
          name: "Fish curry",
          desc: "Creamy curry with white fish and rice.",
          price: "₩8,200",
          diet: "meat",
          dietLabel: "Contains meat or fish"
        }
      ],
      wednesday: [
        {
          name: "Kimbap",
          desc: "Seaweed rice rolls with vegetables and egg.",
          price: "₩5,500",
          diet: "vegetarian",
          dietLabel: "Vegetarian"
        },
        {
          name: "Bulgogi bowl",
          desc: "Marinated beef with steamed rice.",
          price: "₩8,500",
          diet: "meat",
          dietLabel: "Contains meat or fish"
        }
      ],
      thursday: [
        {
          name: "Jjajangmyeon",
          desc: "Black bean noodles with diced pork.",
          price: "₩6,800",
          diet: "meat",
          dietLabel: "Contains meat or fish"
        },
        {
          name: "Temple food plate",
          desc: "Traditional monk-style vegetable feast.",
          price: "₩7,000",
          diet: "vegetarian",
          dietLabel: "Vegetarian"
        },
        {
          name: "Shrimp fried rice",
          desc: "Wok-fried rice with shrimp and veggies.",
          price: "₩7,800",
          diet: "meat",
          dietLabel: "Contains meat or fish"
        },
        {
          name: "Mushroom porridge",
          desc: "Warm rice porridge with wild mushrooms.",
          price: "₩5,200",
          diet: "vegetarian",
          dietLabel: "Vegetarian"
        }
      ],
      friday: [
        {
          name: "Fried chicken set",
          desc: "Crispy fried chicken with fries and drink.",
          price: "₩9,500",
          diet: "meat",
          dietLabel: "Contains meat or fish"
        },
        {
          name: "Veggie wrap",
          desc: "Fresh vegetables wrapped in flatbread.",
          price: "₩5,000",
          diet: "vegetarian",
          dietLabel: "Vegetarian"
        }
      ]
    };

    const dayNames = {
      monday: "Monday",
      tuesday: "Tuesday",
      wednesday: "Wednesday",
      thursday: "Thursday",
      friday: "Friday"
    };

    function renderMeals(day) {
      const meals = menuData[day] || [];
      const listEl = document.getElementById("mealList");
      const headerEl = document.getElementById("mealsHeader");
      const subtitleEl = document.getElementById("daySubtitle");

      listEl.innerHTML = "";
      headerEl.textContent = `${meals.length} meal${meals.length === 1 ? "" : "s"}`;
      subtitleEl.textContent = `${dayNames[day]}'s meals`;

      meals.forEach((meal) => {
        const card = document.createElement("div");
        card.className = "meal-card";
        card.innerHTML = `
          <div class="meal-name">${meal.name}</div>
          <div class="meal-desc">${meal.desc}</div>
          <div class="meal-footer">
            <div class="meal-price">${meal.price}</div>
            <span class="diet-tag ${meal.diet}">${meal.dietLabel}</span>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    document.getElementById("daySelect").addEventListener("change", (e) => {
      renderMeals(e.target.value);
    });

    // Initial render
    renderMeals("monday");
  </script>
</body>
</html>
