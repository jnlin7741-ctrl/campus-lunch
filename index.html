<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Bites</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(180deg, #fff7ed 0%, #ffffff 40%);
      color: #1c1917;
      min-height: 100vh;
    }

    /* Main Content */
    .content {
      padding: 32px 20px 48px 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    .page-title {
      font-size: 36px;
      font-weight: 800;
      color: #c2410c;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    .page-subtitle {
      font-size: 16px;
      color: #a8a29e;
      margin-bottom: 28px;
    }

    /* Day Tabs */
    .day-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .day-tab {
      flex-shrink: 0;
      padding: 10px 18px;
      border-radius: 12px;
      border: 2px solid #f5f5f4;
      background: #ffffff;
      font-size: 15px;
      font-weight: 600;
      color: #78716c;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .day-tab:hover {
      border-color: #fdba74;
    }

    .day-tab.active {
      background: #ea580c;
      border-color: #ea580c;
      color: #ffffff;
    }

    /* Meals Header */
    .meals-header {
      font-size: 14px;
      font-weight: 700;
      color: #a8a29e;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    /* Meal Card */
    .meal-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      border-left: 4px solid #f97316;
      transition: transform 0.15s;
    }

    .meal-card:hover {
      transform: translateY(-2px);
    }

    .meal-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
      gap: 12px;
    }

    .meal-name {
      font-size: 24px;
      font-weight: 700;
      color: #1c1917;
      line-height: 1.2;
    }

    .meal-cal {
      font-size: 13px;
      font-weight: 600;
      color: #ea580c;
      background: #fff7ed;
      padding: 4px 10px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .meal-desc {
      font-size: 16px;
      color: #78716c;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .meal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .meal-price {
      font-size: 22px;
      font-weight: 800;
      color: #c2410c;
    }

    .diet-tag {
      font-size: 13px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .diet-tag.veg {
      color: #166534;
      background: #f0fdf4;
      border: 1px solid #86efac;
    }

    .diet-tag.nonveg {
      color: #991b1b;
      background: #fef2f2;
      border: 1px solid #fca5a5;
    }

    .diet-tag.vegan {
      color: #1e40af;
      background: #eff6ff;
      border: 1px solid #93c5fd;
    }

    /* Footer Note */
    .footer-note {
      margin-top: 40px;
      padding: 16px;
      background: #fff7ed;
      border-radius: 12px;
      font-size: 14px;
      color: #9a3412;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- Main Content -->
  <div class="content">
    <h1 class="page-title">Campus Bites</h1>
    <p class="page-subtitle" id="daySubtitle">Pick a day to see what's cooking</p>

    <!-- Day Tabs -->
    <div class="day-tabs" id="dayTabs"></div>

    <!-- Meals Header -->
    <div class="meals-header" id="mealsHeader">This week's menu</div>

    <!-- Meal Cards Container -->
    <div id="mealList"></div>

    <!-- Footer Note -->
    <p class="footer-note">Menus may change based on ingredient availability. Prices include tax.</p>
  </div>

  <script>
    const menuData = {
      monday: [
        { name: "Cheese Burger", desc: "Beef patty, cheddar, lettuce, brioche bun.", price: "$8.50", cal: "620 kcal", diet: "nonveg", dietLabel: "Non-Veg" },
        { name: "Garden Salad", desc: "Mixed greens, cherry tomatoes, balsamic vinaigrette.", price: "$6.00", cal: "280 kcal", diet: "vegan", dietLabel: "Vegan" },
        { name: "Tomato Soup", desc: "Roasted tomato soup with fresh basil and croutons.", price: "$5.50", cal: "320 kcal", diet: "veg", dietLabel: "Veg" }
      ],
      tuesday: [
        { name: "Beef Tacos", desc: "Three soft tacos with seasoned beef, salsa, and cheese.", price: "$9.00", cal: "540 kcal", diet: "nonveg", dietLabel: "Non-Veg" },
        { name: "Avocado Toast", desc: "Smashed avocado on sourdough with chili flakes.", price: "$7.50", cal: "380 kcal", diet: "vegan", dietLabel: "Vegan" }
      ],
      wednesday: [
        { name: "Margherita Pizza", desc: "Wood-fired pizza with mozzarella and fresh basil.", price: "$10.00", cal: "710 kcal", diet: "veg", dietLabel: "Veg" },
        { name: "Chicken Wrap", desc: "Grilled chicken, hummus, cucumber in a spinach wrap.", price: "$8.00", cal: "450 kcal", diet: "nonveg", dietLabel: "Non-Veg" },
        { name: "Quinoa Bowl", desc: "Quinoa, roasted chickpeas, tahini dressing.", price: "$7.00", cal: "410 kcal", diet: "vegan", dietLabel: "Vegan" }
      ],
      thursday: [
        { name: "Pasta Alfredo", desc: "Fettuccine in creamy parmesan sauce with parsley.", price: "$9.50", cal: "680 kcal", diet: "veg", dietLabel: "Veg" },
        { name: "Fish & Chips", desc: "Battered cod with hand-cut fries and tartar sauce.", price: "$11.00", cal: "850 kcal", diet: "nonveg", dietLabel: "Non-Veg" },
        { name: "Veggie Stir-fry", desc: "Broccoli, bell peppers, tofu in a soy-ginger glaze.", price: "$8.50", cal: "360 kcal", diet: "vegan", dietLabel: "Vegan" }
      ],
      friday: [
        { name: "BBQ Ribs Plate", desc: "Slow-cooked pork ribs with slaw and cornbread.", price: "$13.50", cal: "920 kcal", diet: "nonveg", dietLabel: "Non-Veg" },
        { name: "Sweet Potato Bowl", desc: "Roasted sweet potato, black beans, corn salsa.", price: "$7.50", cal: "440 kcal", diet: "vegan", dietLabel: "Vegan" },
        { name: "Grilled Cheese", desc: "Three-cheese melt on sourdough with tomato dip.", price: "$6.50", cal: "520 kcal", diet: "veg", dietLabel: "Veg" }
      ]
    };

    const dayNames = {
      monday: "Mon", tuesday: "Tue", wednesday: "Wed",
      thursday: "Thu", friday: "Fri"
    };

    const dayFull = {
      monday: "Monday", tuesday: "Tuesday", wednesday: "Wednesday",
      thursday: "Thursday", friday: "Friday"
    };

    let currentDay = "monday";

    function renderDayTabs() {
      const tabsEl = document.getElementById("dayTabs");
      tabsEl.innerHTML = "";
      Object.keys(menuData).forEach((day) => {
        const tab = document.createElement("div");
        tab.className = "day-tab" + (day === currentDay ? " active" : "");
        tab.textContent = dayNames[day];
        tab.onclick = () => {
          currentDay = day;
          renderDayTabs();
          renderMeals(day);
        };
        tabsEl.appendChild(tab);
      });
    }

    function renderMeals(day) {
      const meals = menuData[day] || [];
      const listEl = document.getElementById("mealList");
      const headerEl = document.getElementById("mealsHeader");
      const subtitleEl = document.getElementById("daySubtitle");

      listEl.innerHTML = "";
      headerEl.textContent = `${dayFull[day]} · ${meals.length} option${meals.length === 1 ? "" : "s"}`;
      subtitleEl.textContent = `${dayFull[day]}'s specials`;

      meals.forEach((meal) => {
        const card = document.createElement("div");
        card.className = "meal-card";
        card.innerHTML = `
          <div class="meal-top">
            <div class="meal-name">${meal.name}</div>
            <span class="meal-cal">${meal.cal}</span>
          </div>
          <div class="meal-desc">${meal.desc}</div>
          <div class="meal-footer">
            <div class="meal-price">${meal.price}</div>
            <span class="diet-tag ${meal.diet}">${meal.dietLabel}</span>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    renderDayTabs();
    renderMeals(currentDay);
  </script>
</body>
</html>
